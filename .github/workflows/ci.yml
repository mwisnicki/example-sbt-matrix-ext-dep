on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - uses: sbt/setup-sbt@v1
      
      - run: sbt compile
      - run: sbt test
      - run: sbt run
